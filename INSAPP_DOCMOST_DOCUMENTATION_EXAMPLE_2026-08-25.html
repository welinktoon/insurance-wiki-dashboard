    function formatInline(value) {
      return String(value).replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function renderMeta(items) {
      return `<div class="meta-grid">${items.map(([label, value]) => `<div class="meta-cell"><span class="meta-label">${label}</span><span class="meta-value">${formatInline(value)}</span></div>`).join("")}</div>`;
    }

    function sectionTitle(section) {
      if (section.type === "sources") return "Связанные источники";
      return section.title || "";
    }

    function renderSection(section, index) {
      const id = `section-${index}`;
      if (section.type === "callout") return `<section class="section" id="${id}"><div class="callout">${section.body}</div></section>`;
      if (section.type === "code") return `<section class="section" id="${id}"><h2>${section.title}</h2><pre>${section.body.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</pre></section>`;
      if (section.type === "table") {
        const head = section.headers.map((header) => `<th>${formatInline(header)}</th>`).join("");
        const rows = section.rows.map((row) => `<tr>${row.map((cell) => `<td>${formatInline(cell)}</td>`).join("")}</tr>`).join("");
        return `<section class="section" id="${id}"><h2>${section.title}</h2><table class="field-table"><thead><tr>${head}</tr></thead><tbody>${rows}</tbody></table></section>`;
      }
      if (section.type === "sources") {
        return `<section class="section" id="${id}"><h2>Связанные источники</h2><div class="source-list">${section.items.map(([label, value]) => `<div class="source"><span>${label}</span><strong>${formatInline(value)}</strong></div>`).join("")}</div></section>`;
      }
      return `<section class="section" id="${id}"><h2>${section.title}</h2>${section.body}</section>`;
    }

    function renderArticleNav(sections) {
      const links = sections.map((section, index) => [sectionTitle(section), index]).filter(([title]) => title);
      if (links.length < 2) return "";
      return `<nav class="article-nav" aria-label="Содержание страницы"><strong>На этой странице</strong>${links.map(([title, index]) => `<a href="#section-${index}">${title}</a>`).join("")}</nav>`;
    }

    function renderDocument(key) {
      const doc = documents[key] || documents.map;
      document.getElementById("reader-path").textContent = doc.path.join(" / ");
      document.getElementById("document").innerHTML = [
        `<div class="crumbs">${doc.path.map((item) => `<span>${item}</span>`).join("")}</div>`,
        `<h1 class="document-title">${doc.title}</h1>`,
        `<p class="document-summary">${doc.summary}</p>`,
        renderMeta(doc.meta),
        renderArticleNav(doc.sections),
        doc.sections.map(renderSection).join("")
      ].join("");
      document.querySelectorAll(".tree-item, .tree-section-item").forEach((item) => item.classList.toggle("is-active", item.dataset.doc === key));
      document.title = `Insapp: ${doc.title}`;
    }

    document.querySelectorAll(".tree-item, .tree-section-item").forEach((item) => {
      item.addEventListener("click", (event) => {
        if (item.classList.contains("tree-section-item")) {
          event.preventDefault();
          event.stopPropagation();
        }
        renderDocument(item.dataset.doc);
        const reader = document.querySelector(".reader");
        if (window.innerWidth < 681) reader.scrollIntoView({ behavior: "smooth" });
        else reader.scrollTop = 0;
      });
    });

    renderDocument("section-code");
  </script>
